<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICC Men's T20 World Cup Finals History</title>
   
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f4ed;
      color: #111;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    header p {
      color: #666;
      font-size: 1rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    /* Modal Styles */
    #tournament-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-box {
      background: #fdfbf7;
      width: 100%;
      max-width: 700px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
    }
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #111;
      color: #fff;
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>ICC Men's T20 World Cup</h1>
    <p>A complete historical archive of champions, runners-up, and tournament statistics.</p>
  </header>

  <div class="container" id="t20-finals-container">
    <!-- Cards injected dynamically via script -->
  </div>

  <!-- Detail Modal -->
  <div id="tournament-modal" onclick="if(event.target === this) closeModal();">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const t20Finals = [
      {
        year: 2007, winner: "INDIA", runnerUp: "Pakistan", margin: "5 runs", venue: "Johannesburg", bg: "#1e1e1e", img: "assets/2007.jpg",
        dates: "11-24 September 2007 • Hosted by South Africa.", semiFinals: "Australia, Pakistan & India, New Zealand", hostCountry: "South Africa",
        mostRuns: "Matthew Hayden (Australia) - 265 runs", mostWickets: "Umar Gul (Pakistan) - 13 wickets", playerOfTournament: "Shahid Afridi (Pakistan)",
        venuesList: ["New Wanderers Stadium, Johannesburg", "Kingsmead, Durban", "Newlands, Cape Town"]
      },
      {
        year: 2009, winner: "PAKISTAN", runnerUp: "Sri Lanka", margin: "8 wickets", venue: "Lord's", bg: "#b30000", img: "assets/2009.webp",
        dates: "5-21 June 2009 • Hosted by England.", semiFinals: "Pakistan, South Africa, Sri Lanka, West Indies", hostCountry: "England",
        mostRuns: "Tillakaratne Dilshan (Sri Lanka) - 317 runs", mostWickets: "Umar Gul (Pakistan) - 13 wickets", playerOfTournament: "Tillakaratne Dilshan (Sri Lanka)",
        venuesList: ["Lord's, London", "Trent Bridge, Nottingham", "The Oval, London"]
      },
      {
        year: 2010, winner: "ENGLAND", runnerUp: "Australia", margin: "7 wickets", venue: "Bridgetown", bg: "#1b4d3e", img: "assets/2010.jpg",
        dates: "30 April - 16 May 2010 • Hosted by West Indies.", semiFinals: "Australia, England, Pakistan, Sri Lanka", hostCountry: "West Indies",
        mostRuns: "Mahela Jayawardene (Sri Lanka) - 302 runs", mostWickets: "Dirk Nannes (Australia) - 14 wickets", playerOfTournament: "Kevin Pietersen (England)",
        venuesList: ["Kensington Oval, Barbados", "Beausejour Stadium, St. Lucia", "Providence Stadium, Guyana"]
      },
      {
        year: 2012, winner: "WEST INDIES", runnerUp: "Sri Lanka", margin: "36 runs", venue: "Colombo", bg: "#1e1e1e", img: "assets/2012.avif",
        dates: "18 September - 7 October 2012 • Hosted by Sri Lanka.", semiFinals: "Australia, Pakistan, Sri Lanka, West Indies", hostCountry: "Sri Lanka",
        mostRuns: "Shane Watson (Australia) - 249 runs", mostWickets: "Ajantha Mendis (Sri Lanka) - 15 wickets", playerOfTournament: "Shane Watson (Australia)",
        venuesList: ["R. Premadasa Stadium, Colombo", "Pallekele International Cricket Stadium, Kandy", "Hambantota"]
      },
      {
        year: 2014, winner: "SRI LANKA", runnerUp: "India", margin: "6 wickets", venue: "Mirpur", bg: "#b30000", img: "assets/2014.webp",
        dates: "16 March - 6 April 2014 • Hosted by Bangladesh.", semiFinals: "India, South Africa, Sri Lanka, West Indies", hostCountry: "Bangladesh",
        mostRuns: "Virat Kohli (India) - 319 runs", mostWickets: "Imran Tahir (South Africa) & Ahsan Malik (Netherlands) - 12 wickets", playerOfTournament: "Virat Kohli (India)",
        venuesList: ["Sher-e-Bangla National Cricket Stadium, Mirpur", "Zohur Ahmed Chowdhury Stadium, Chittagong", "Sylhet"]
      },
      {
        year: 2016, winner: "WEST INDIES", runnerUp: "England", margin: "4 wickets", venue: "Kolkata", bg: "#1b4d3e", img: "assets/2016.webp",
        dates: "8 March - 3 April 2016 • Hosted by India.", semiFinals: "England, India, New Zealand, West Indies", hostCountry: "India",
        mostRuns: "Tamim Iqbal (Bangladesh) - 295 runs", mostWickets: "Mohammad Nabi (Afghanistan) - 12 wickets", playerOfTournament: "Virat Kohli (India)",
        venuesList: ["Eden Gardens, Kolkata", "Wankhede Stadium, Mumbai", "Feroz Shah Kotla, Delhi", "M. Chinnaswamy Stadium, Bengaluru"]
      },
     {
  year: 2021, winner: "AUSTRALIA", runnerUp: "New Zealand", margin: "8 wickets", venue: "Dubai", bg: "#1e1e1e", img: "assets/2021.webp",
  dates: "17 October - 14 November 2021 • Hosted by Oman & UAE.", semiFinals: "Australia, England, New Zealand, Pakistan", hostCountry: "Oman & UAE",
  mostRuns: "Babar Azam (Pakistan) - 303 runs", mostWickets: "Wanindu Hasaranga (Sri Lanka) - 16 wickets", playerOfTournament: "David Warner (Australia)",
  venuesList: ["Dubai International Stadium", "Sheikh Zayed Cricket Stadium, Abu Dhabi", "Sharjah Cricket Stadium", "Al Amerat Cricket Stadium, Oman"]
}
      {
        year: 2022, winner: "ENGLAND", runnerUp: "Pakistan", margin: "5 wickets", venue: "Melbourne", bg: "#b30000", img: "assets/2022.jpg",
        dates: "16 October - 13 November 2022 • Hosted by Australia.", semiFinals: "England, India, New Zealand, Pakistan", hostCountry: "Australia",
        mostRuns: "Virat Kohli (India) - 296 runs", mostWickets: "Wanindu Hasaranga (Sri Lanka) - 15 wickets", playerOfTournament: "Sam Curran (England)",
        venuesList: ["Melbourne Cricket Ground (MCG)", "Sydney Cricket Ground (SCG)", "Adelaide Oval", "Perth Stadium"]
      },
      {
        year: 2024, winner: "INDIA", runnerUp: "South Africa", margin: "7 runs", venue: "Bridgetown", bg: "#1b4d3e", img: "assets/2024.avif",
        dates: "1-29 June 2024 • Hosted by USA & West Indies.", semiFinals: "Afghanistan, England, India, South Africa", hostCountry: "USA & West Indies",
        mostRuns: "Rahmanullah Gurbaz (Afghanistan) - 281 runs", mostWickets: "Fazalhaq Farooqi & Arshdeep Singh - 17 wickets", playerOfTournament: "Jasprit Bumrah (India)",
        venuesList: ["Kensington Oval, Barbados", "Brian Lara Stadium, Trinidad", "Nassau County, New York", "Grand Prairie Stadium, Texas"]
      },
      {
        year: 2026, winner: "INDIA", runnerUp: "New Zealand", margin: "96 runs", venue: "Ahmedabad", bg: "#1b4d3e", img: "assets/2026.avif",
        dates: "February - March 2026 • Hosted by India & Sri Lanka.", semiFinals: "India, New Zealand, Australia, England", hostCountry: "India & Sri Lanka",
        mostRuns: "Sanju Samson (India) - 321 runs", mostWickets: "Jasprit Bumrah (India) - 19 wickets", playerOfTournament: "Sanju Samson (India)",
        venuesList: ["Narendra Modi Stadium, Ahmedabad", "Wankhede Stadium, Mumbai", "R. Premadasa Stadium, Colombo"]
      }
    ];

    const container = document.getElementById('t20-finals-container');
    if (container) {
      let html = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">';
      t20Finals.forEach((match, index) => {
        html += `
          <div style="background: ${match.bg}; color: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: flex; flex-direction: column; justify-content: space-between;">
            <div>
              <div style="width: 100%; height: 180px; overflow: hidden; background: #000;">
                <img src="${match.img}" alt="${match.year} Winner" style="width: 100%; height: 100%; object-fit: cover;">
              </div>
              <div style="padding: 20px;">
                <div style="font-size: 1.8rem; font-weight: bold; margin-bottom: 5px;">${match.year}</div>
                <div style="font-size: 1.15rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 12px;">${match.winner}</div>
                <p style="font-size: 0.85rem; line-height: 1.4; opacity: 0.9; margin-bottom: 12px;">
                  Winner defeated ${match.runnerUp} by ${match.margin} at ${match.venue}.
                </p>
                <div style="background: rgba(255,255,255,0.1); padding: 8px 10px; border-radius: 4px; margin-bottom: 15px; font-size: 0.8rem;">
                  <span style="opacity: 0.7; display: block; font-size: 0.7rem; text-transform: uppercase;">Player of the Tournament</span>
                  <strong>⭐ ${match.playerOfTournament}</strong>
                </div>
              </div>
            </div>
            <div style="padding: 0 20px 20px 20px;">
              <a href="#" onclick="openModal(${index}); return false;" style="color: #ffcc00; text-decoration: none; font-size: 0.85rem; font-weight: bold; display: inline-block;">TOURNAMENT DETAILS &rarr;</a>
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function openModal(index) {
      const data = t20Finals[index];
      const modalContent = document.getElementById('modal-content');
      modalContent.innerHTML = `
        <div style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 5px;">Tournament Profile</div>
        <h2 style="font-size: 2.2rem; font-weight: 900; margin-top: 0; margin-bottom: 5px;">${data.year} T20 WORLD CUP</h2>
        <p style="color: #555; margin-bottom: 25px; font-size: 0.95rem;">${data.dates}</p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
          <div style="background: #fff; padding: 20px; border: 1px solid #e0dbcc; border-radius: 6px; color: #111;">
            <h3 style="font-size: 1rem; border-bottom: 2px solid #111; padding-bottom: 8px; margin-top: 0;">FINAL STANDINGS</h3>
            <p style="display: flex; justify-content: space-between; margin: 10px 0; border-bottom: 1px solid #eee; padding-bottom: 5px;"><span>Champions</span> <strong>${data.winner}</strong></p>
            <p style="display: flex; justify-content: space-between; margin: 10px 0; border-bottom: 1px solid #eee; padding-bottom: 5px;"><span>Runners-up</span> <strong>${data.runnerUp}</strong></p>
            <p style="display: flex; justify-content: space-between; margin: 10px 0; border-bottom: 1px solid #eee; padding-bottom: 5px;"><span>Semi-finalists</span> <strong>${data.semiFinals}</strong></p>
            <p style="display: flex; justify-content: space-between; margin: 10px 0;"><span>Host country</span> <strong>${data.hostCountry}</strong></p>
          </div>
          
          <div style="background: #fff; padding: 20px; border: 1px solid #e0dbcc; border-radius: 6px; color: #111;">
            <h3 style="font-size: 1rem; border-bottom: 2px solid #111; padding-bottom: 8px; margin-top: 0;">INDIVIDUAL LEADERS</h3>
            <div style="background: #f4efe6; padding: 10px; margin-bottom: 10px; border-radius: 4px;">
              <div style="font-size: 0.75rem; color: #777; font-weight: bold;">MOST RUNS</div>
              <div style="font-weight: bold; font-size: 0.9rem;">${data.mostRuns}</div>
            </div>
            <div style="background: #f4efe6; padding: 10px; margin-bottom: 10px; border-radius: 4px;">
              <div style="font-size: 0.75rem; color: #777; font-weight: bold;">MOST WICKETS</div>
              <div style="font-weight: bold; font-size: 0.9rem;">${data.mostWickets}</div>
            </div>
            <div style="background: #f4efe6; padding: 10px; border-radius: 4px;">
              <div style="font-size: 0.75rem; color: #777; font-weight: bold;">PLAYER OF TOURNAMENT</div>
              <div style="font-weight: bold; font-size: 0.9rem;">${data.playerOfTournament}</div>
            </div>
          </div>
        </div>

        <div style="background: #fff; padding: 20px; border: 1px solid #e0dbcc; border-radius: 6px; color: #111;">
          <h3 style="font-size: 1rem; border-bottom: 2px solid #111; padding-bottom: 8px; margin-top: 0;">HOST VENUES</h3>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;">
            ${data.venuesList.map(v => `<span style="background: #f4efe6; padding: 6px 12px; font-size: 0.85rem; border-radius: 4px; border: 1px solid #e2dad0;">${v}</span>`).join('')}
          </div>
        </div>
      `;
      document.getElementById('tournament-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('tournament-modal').style.display = 'none';
    }
  </script>
</body>
</html>
