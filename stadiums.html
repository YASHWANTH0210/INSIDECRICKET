        let currentFilter = 'all';

        function renderStadiums(filter = 'all', searchQuery = '') {
            const grid = document.getElementById('stadiumGrid');
            grid.innerHTML = '';

            const filtered = stadiums.filter(s => {
                const matchesCategory = filter === 'all' || s.country === filter;
                const matchesSearch = s.name.toLowerCase().includes(searchQuery.toLowerCase()) || s.location.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No stadiums found matching your search.</div>`;
                return;
            }

            filtered.forEach((stadium) => {
                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-emerald-500/30 rounded-xl overflow-hidden shadow-lg hover:border-emerald-500 transition-all duration-300 group flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="h-48 bg-gray-800 relative overflow-hidden">
                            <img src="${stadium.image}" alt="${stadium.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=800&q=80';">
                            <span class="absolute top-3 right-3 bg-emerald-600 text-white text-xs font-semibold px-2.5 py-1 rounded-full shadow">${stadium.location}</span>
                        </div>
                        <div class="p-5">
                            <h3 class="text-xl font-bold text-white mb-1">${stadium.name}</h3>
                            <p class="text-emerald-400 text-sm font-medium mb-3">Capacity: ${stadium.capacity}</p>
                            <p class="text-gray-400 text-xs leading-relaxed mb-4 line-clamp-2">${stadium.highlights}</p>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-0">
                        <button onclick="openStadiumModal('${stadium.name.replace(/'/g, "\\'")}')" class="w-full bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-emerald-500/40 text-xs font-semibold py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                            <span>Explore Venue Analytics</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openStadiumModal(name) {
            const stadium = stadiums.find(s => s.name === name);
            if (!stadium) return;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="relative h-64 sm:h-72 w-full">
                    <img src="${stadium.image}" alt="${stadium.name}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-black/40"></div>
                    <div class="absolute bottom-4 left-4 right-4">
                        <span class="bg-emerald-600 text-white text-xs font-semibold px-3 py-1 rounded-full shadow">${stadium.location}</span>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-2">${stadium.name}</h2>
                        <p class="text-emerald-400 text-sm font-medium">Capacity: ${stadium.capacity}</p>
                    </div>
                </div>
                <div class="p-6 space-y-6">
                    <!-- Highlights -->
                    <div>
                        <h4 class="text-xs uppercase tracking-wider text-emerald-400 font-bold mb-1"><i class="fa-solid fa-star mr-1"></i> Ground Highlight</h4>

                    </div>

                    <!-- Pitch Condition -->
                    <div class="bg-gray-950 p-4 rounded-xl border border-gray-800">
                        <h4 class="text-xs uppercase tracking-wider text-emerald-400 font-bold mb-1"><i class="fa-solid fa-seedling mr-1"></i> Pitch Condition & Behavior</h4>
                        <p class="text-gray-300 text-sm leading-relaxed">${stadium.pitch}</p>
                    </div>

                    <!-- Avg Scores -->
                    <div>
                        <h4 class="text-xs uppercase tracking-wider text-emerald-400 font-bold mb-3"><i class="fa-solid fa-chart-bar mr-1"></i> Average Scores by Format</h4>
                        <div class="grid grid-cols-3 gap-3 text-center">
                            <div class="bg-gray-800/60 p-3 rounded-lg border border-gray-700/50">
                                <span class="block text-gray-400 text-xs">Test (1st Inn)</span>
                                <span class="text-white font-bold text-sm sm:text-base">${stadium.scores.test}</span>
                            </div>
                            <div class="bg-gray-800/60 p-3 rounded-lg border border-gray-700/50">
                                <span class="block text-gray-400 text-xs">ODI Average</span>
                                <span class="text-white font-bold text-sm sm:text-base">${stadium.scores.odi}</span>
                            </div>
                            <div class="bg-gray-800/60 p-3 rounded-lg border border-gray-700/50">
                                <span class="block text-gray-400 text-xs">T20 Average</span>
                                <span class="text-white font-bold text-sm sm:text-base">${stadium.scores.t20}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Dimensions & Suitability Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-gray-950 p-4 rounded-xl border border-gray-800">
                            <h4 class="text-xs uppercase tracking-wider text-emerald-400 font-bold mb-1"><i class="fa-solid fa-ruler-combined mr-1"></i> Dimensions</h4>
                            <p class="text-gray-300 text-xs leading-relaxed">${stadium.dimensions}</p>
                        </div>
                        <div class="bg-gray-950 p-4 rounded-xl border border-gray-800">
                            <h4 class="text-xs uppercase tracking-wider text-emerald-400 font-bold mb-1"><i class="fa-solid fa-user-check mr-1"></i> Player Suitability</h4>
                            <p class="text-gray-300 text-xs leading-relaxed">${stadium.suitability}</p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('stadiumModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('stadiumModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function filterStadiums(country, event) {
            currentFilter = country;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white');
                btn.classList.add('bg-gray-800', 'text-gray-300');
            });
            if (event && event.target) {
                event.target.classList.remove('bg-gray-800', 'text-gray-300');
                event.target.classList.add('bg-emerald-600', 'text-white');
            }

            const searchQuery = document.getElementById('stadiumSearch').value;
            renderStadiums(country, searchQuery);
        }

        document.getElementById('stadiumSearch').addEventListener('input', (e) => {
            renderStadiums(currentFilter, e.target.value);
        });

        // Close modal on background click
        document.getElementById('stadiumModal').addEventListener('click', (e) => {
            if (e.target.id === 'stadiumModal') closeModal();
        });

        // Initial Render
        renderStadiums();
    </script>
